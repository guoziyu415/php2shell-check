   Defensive only. It reads text you paste, nothing is sent anywhere.
   MIT License. https://github.com/guoziyu415/php2shell-check */
(function (root, factory) {

    frankenphp: { risk: 2, ja: "FrankenPHP", en: "FrankenPHP" },
    litespeed: { risk: 2, ja: "LiteSpeed", en: "LiteSpeed" },
    web: { risk: 2, ja: "Web で動く PHP（方式は不明）", en: "PHP serving web requests, mode unknown" },
    unknown: { risk: 2, ja: "動かし方は不明", en: "mode unknown" },
    cli: { risk: 1, ja: "CLI（Web を処理しない）", en: "CLI, not serving web requests" },
    ci: { risk: 1, ja: "CI のテスト用", en: "CI tests" },
    req: { risk: 0, ja: "composer の動作条件", en: "composer requirement" }
  };

  function cmpPatch(branch, patch) { return FIXED[branch] !== undefined ? (patch >= FIXED[branch] ? "fixed" : "vulnerable") : null; }

  // Decide the status of one PHP version.
  // v = {major, minor, patch (number or null), rc (number or null), distro (string or null), floating (bool)}
  function judge(v) {
    var branch = v.major + "." + v.minor;
    var num = v.major * 100 + v.minor;
    if (v.major === 8 && v.minor === 6) {
      if (v.rc !== null && v.rc !== undefined && v.rc >= FIXED_RC_86) return { st: "fixed", branch: branch, target: "8.6.0RC" + FIXED_RC_86 };

    fixed: { level: 0, ja: "修正済み", en: "Fixed" },
    pull: { level: 1, ja: "イメージの更新を確認", en: "Check the image" },
    vendor: { level: 2, ja: "ディストリの対応を確認", en: "Check your vendor" },
    unknownpatch: { level: 2, ja: "パッチ番号を確認", en: "Check the exact version" },
    vulnerable: { level: 3, ja: "要アップデート", en: "Update now" },
    eolbackport: { level: 4, ja: "サポート終了・公式版なし", en: "End of life, no release" },

  document.title = lang === "en" ? "PHP2Shell Check · is your PHP affected · Code415" : "PHP2Shell チェッカー · 自分の PHP が対象か判定 · Code415";
  render(true);
}
$("samples").addEventListener("click", function(e){ var b = e.target.closest("[data-s]"); if (b) typeIn(SAMPLES[b.getAttribute("data-s")], 900); });
document.querySelectorAll(".langs button").forEach(function(b){ b.onclick = function(){ lang = b.getAttribute("data-l"); applyLang(); }; });
ta.addEventListener("input", function(){ render(false); });

var prevKeys = {};
function render(quiet){
  var text = ta.value, res = P.analyze(text), keys = {};
  if (!text.trim()) { $("sum").innerHTML = '<div class="empty" style="width:100%">' + esc(t("none")) + "</div>"; $("rows").innerHTML = ""; prevKeys = {}; return; }
  if (!res.rows.length) { $("sum").innerHTML = '<div class="empty" style="width:100%">' + esc(t("nothing")) + "</div>"; $("rows").innerHTML = ""; prevKeys = {}; return; }
  var w = Math.max(0, res.worst), sumIdx = [0, 1, 2, 3, 4][w];
  var stKeyForWorst = ["fixed", "pull", "vendor", "vulnerable", "eolnone"][w];
  var counts = Object.keys(res.counts).map(function(k){ return '<span style="--c:' + COL[k] + '">' + esc(P.ST[k][lang]) + " " + res.counts[k] + "</span>"; }).join("");
  $("sum").style.setProperty("--c", COL[stKeyForWorst]);
  $("sum").innerHTML = '<div class="chip" style="--c:' + COL[stKeyForWorst] + '">' + (w === 0 ? "✓" : w === 1 ? "↻" : "!") + '</div><div><p class="big" style="color:' + COL[stKeyForWorst] + '">' + esc(t("sum")[sumIdx]) + "</p><p>" + esc(fmt(t("sumP"), {n: res.rows.length})) + '</p><div class="counts">' + counts + "</div></div>";
  $("rows").innerHTML = res.rows.map(function(r){
    var e = P.explain(r, lang), k = r.find.line + ":" + r.find.raw + ":" + r.st;
    var born = !quiet && !prevKeys[k] ? now : (prevKeys[k] || 0); keys[k] = born || 1;
    return '<div class="card row" style="--c:' + COL[r.st] + '"' + (REC ? ' data-born="' + born + '"' : "") + '><div class="h"><span class="st">' + esc(P.ST[r.st][lang]) + '</span><span class="name">' + esc(e.head) + '</span><span class="meta">' + esc(fmt(t("line"), {n: r.find.line})) + '</span></div><span class="sapi' + (r.find.sapi === "modphp" && r.st !== "fixed" ? " hot" : "") + '">' + esc(e.sapi) + "</span><p>" + esc(e.text) + "</p>" + (r.fix ? '<div class="fix">' + esc(r.fix) + "</div>" : "") + "</div>";
  }).join("");
  prevKeys = keys;
}
function typeIn(s, dur){
  var lastN = -1;
  anim(dur, function(p){ var n = Math.round(s.length * p); if (n === lastN) return; lastN = n; var cut = n >= s.length ? s.length : s.lastIndexOf("\n", n); ta.value = s.slice(0, Math.max(0, cut)); render(false); }, function(){ ta.value = s; render(false); });
}
applyLang();
if (Q.get("text")) { ta.value = Q.get("text"); render(true); }
if (REC) {
  window.SAMPLES = SAMPLES;
  window.__sc = {
    tick: step, typeIn: typeIn, setLang: function(l){ lang = l; applyLang(); },
    setText: function(s){ ta.value = s; render(false); },
    cap: function(s){ var c = $("cap"), from = +c.style.opacity || 0, to = s ? 1 : 0; if (s) c.textContent = s; anim(300, function(p){ c.style.opacity = from + (to - from) * p; }); },
    scrollToSel: function(sel, off, ms){ var el = document.querySelector(sel), y0 = window.scrollY, y = el.getBoundingClientRect().top + y0 + (off || 0); anim(ms || 700, function(p){ var e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; window.scrollTo(0, y0 + (y - y0) * e); }); },
    scrollTo: function(y, ms){ var y0 = window.scrollY; anim(ms || 700, function(p){ var e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2; window.scrollTo(0, y0 + (y - y0) * e); }); },
    press: function(k){ var b = document.querySelector('[data-s="' + k + '"]'); document.querySelectorAll("[data-s]").forEach(function(x){ x.classList.toggle("on", x === b); }); }
  };
}
})();
</script>
